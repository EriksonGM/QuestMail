name: questmail-tests

services:
  maildev:
    image: maildev/maildev:3.0.0
    ports:
      - "127.0.0.1:${MAILDEV_WEB_PORT:-1080}:1080"
      - "127.0.0.1:${MAILDEV_SMTP_PORT:-1025}:1025"
    environment:
      MAILDEV_IP: 0.0.0.0
      MAILDEV_WEB_IP: 0.0.0.0
      MAILDEV_SMTP_PORT: "1025"
      MAILDEV_WEB_PORT: "1080"
