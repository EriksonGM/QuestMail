name: Build, Test and Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (Maior = major, Minor = minor, Fix = patch)'
        required: true
        type: choice
        options:
          - Maior
          - Minor
          - Fix
        default: Fix

permissions:
  contents: read

concurrency:
  group: questmail-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Require a manual release from master
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Releases must be started manually from master."
            exit 1
          fi

      - name: Checkout source and release tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Determine package version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        shell: python
        run: |
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          stable_version = re.compile(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)")
          tags = subprocess.check_output(["git", "tag", "--list", "v*"], text=True).splitlines()
          versions = [
              tuple(map(int, match.groups()))
              for tag in tags
              if (match := stable_version.fullmatch(tag[1:]))
          ]
          if versions:
              current = max(versions)
          else:
              project_version = ET.parse("src/QuestMail.Core/QuestMail.Core.csproj").findtext("PropertyGroup/Version")
              match = stable_version.fullmatch(project_version or "")
              if not match:
                  raise SystemExit("::error::The project must define a stable MAJOR.MINOR.PATCH version.")
              current = tuple(map(int, match.groups()))

          major, minor, patch = current
          release_type = os.environ["RELEASE_TYPE"]
          if release_type == "Maior":
              next_version = (major + 1, 0, 0)
          elif release_type == "Minor":
              next_version = (major, minor + 1, 0)
          elif release_type == "Fix":
              next_version = (major, minor, patch + 1)
          else:
              raise SystemExit("::error::Release type must be Maior, Minor or Fix.")

          version = ".".join(map(str, next_version))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\nrelease_tag=v{version}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Release\n\n{release_type}: {'.'.join(map(str, current))} → **{version}**\n")

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore QuestMail.slnx

      - name: Build
        run: dotnet build QuestMail.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --solution QuestMail.slnx --configuration Release --no-build --no-restore --report-trx --results-directory ./TestResults

      - name: Pack
        run: dotnet pack ./src/QuestMail.Core/QuestMail.Core.csproj --configuration Release --no-build --no-restore -p:Version=${{ steps.version.outputs.version }} --output ./artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Sign in to NuGet using Trusted Publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: EriksonG # NuGet profile that created the trust policy, not an organization name.

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json

      - name: Create release and tag for the published version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "QuestMail $PACKAGE_VERSION" \
            --generate-notes
