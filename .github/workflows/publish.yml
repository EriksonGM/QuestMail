name: Build, Test and Publish

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing stable release tag to validate and publish (for example, v0.1.0)'
        required: true
        type: string
        default: 'v0.1.0'
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: questmail-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Determine package version
        id: version
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        shell: bash
        run: |
          version="0.1.0-ci.${GITHUB_RUN_NUMBER}"
          source_ref="$GITHUB_REF"
          release_tag=""
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/master ]]; then
              echo "::error::Manual releases must use the workflow from master."
              exit 1
            fi
            release_tag="$RELEASE_TAG_INPUT"
            if [[ -z "$release_tag" ]]; then
              echo "::error::An existing release tag is required."
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$release_tag" ]]; then
            if ! [[ "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Release tags must use vMAJOR.MINOR.PATCH (for example, v0.1.0)."
              exit 1
            fi
            version="${release_tag#v}"
            source_ref="refs/tags/$release_tag"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.source_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore QuestMail.slnx

      - name: Build
        run: dotnet build QuestMail.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --solution QuestMail.slnx --configuration Release --no-build --no-restore --report-trx --results-directory ./TestResults

      - name: Pack
        run: dotnet pack ./src/QuestMail.Core/QuestMail.Core.csproj --configuration Release --no-build --no-restore -p:Version=${{ steps.version.outputs.version }} --output ./artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Sign in to NuGet using Trusted Publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: EriksonG # NuGet profile that created the trust policy, not an organization name.

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json
